<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Maze</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; color: white;
        }
        #hud {
            position: absolute; top: 20px; left: 20px; text-align: left;
            font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 10px; height: 10px; background: rgba(255, 255, 255, 0.5); border-radius: 50%;
        }
        
        #stamina-container {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 300px; height: 15px; background: rgba(0,0,0,0.6); 
            border: 2px solid #aaa; border-radius: 8px; overflow: hidden;
        }
        #stamina-bar {
            width: 100%; height: 100%; background: #00ff00; 
            transition: background-color 0.3s;
        }
        .exhausted { background: #ff0000 !important; }

        .overlay { background: rgba(0,0,0,0.8); padding: 40px; border-radius: 10px; pointer-events: auto; }
        button {
            padding: 15px 30px; font-size: 20px; cursor: pointer; background: #fff; color: #000;
            border: none; border-radius: 5px; font-weight: bold; margin-top: 20px;
        }
        button:hover { background: #ddd; }
        
        /* Кнопка звука */
        #btn-mute {
            position: absolute; top: 20px; right: 20px;
            padding: 10px 15px; font-size: 24px; pointer-events: auto;
            background: rgba(0,0,0,0.5); color: white; border: 2px solid white;
        }
        #btn-mute.muted { opacity: 0.5; text-decoration: line-through; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div id="hud" class="hidden">
            Уровень: <span id="ui-level">1</span><br>
            Мешочки: <span id="ui-bags">0/0</span>
        </div>
        <div id="crosshair" class="hidden"></div>
        
        <button id="btn-mute">🔊 (M)</button>

        <div id="stamina-container" class="hidden">
            <div id="stamina-bar"></div>
        </div>

        <div id="menu" class="overlay">
            <h1 id="menu-title">SURVIVAL MAZE</h1>
            <p id="menu-desc">Собери все мешочки и найди синий лифт. Берегись призрака.<br>Управление: WASD. Бег: Shift. Звук: M.</p>
            <button id="btn-start">Начать игру</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "./node_modules/three/build/three.module.js",
                "three/addons/": "./node_modules/three/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="script.js"></script>
</body>
</html>
